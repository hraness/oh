name: N-API matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: napi-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build N-API crates (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: rust
      - name: Clippy N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo clippy --locked --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi -- -D warnings
      - name: Build N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo build --release --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi
      - name: Stage .node artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="rust/napi-artifacts/${{ matrix.target }}"
          mkdir -p "$out"
          for lib in oh_canonical_napi oh_archive_napi oh_sqlite_napi; do
            found=""
            for ext in so dylib dll; do
              src="rust/target/${{ matrix.target }}/release/lib${lib}.${ext}"
              [ -f "$src" ] || src="rust/target/${{ matrix.target }}/release/${lib}.${ext}"
              if [ -f "$src" ]; then
                name="${lib%_napi}.napi"
                cp "$src" "$out/${name}.${{ matrix.target }}.node"
                found=1
                break
              fi
            done
            [ -n "$found" ] || { echo "missing built library for ${lib}" >&2; exit 1; }
          done
          ls -l "$out"
      - name: Upload .node artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-${{ matrix.target }}
          path: rust/napi-artifacts/${{ matrix.target }}/*.node
          if-no-files-found: error
