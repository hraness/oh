name: N-API matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: napi-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build N-API crates (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b07e38d7f5cbb1d5a86a2255a8b8e2a # v2.7.8
        with:
          workspaces: rust
      - name: Clippy N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo clippy --locked --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi -- -D warnings
      - name: Build N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo build --release --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi
      - name: Upload .node artifacts
        uses: actions/upload-artifact@65c4c3a3114ee7398c7db1b3e422b47aa9bca4f5 # v4.6.0
        with:
          name: napi-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/liboh_canonical_napi*.node
            rust/target/${{ matrix.target }}/release/liboh_archive_napi*.node
            rust/target/${{ matrix.target }}/release/liboh_sqlite_napi*.node
          if-no-files-found: error
