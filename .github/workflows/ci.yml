name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Pull requests cancel their own superseded runs. Main runs group by commit, so
# a later merge never cancels verification of an earlier one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Main pushes run every job; pull requests skip jobs whose inputs did not change.
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'scripts/build-rust-*.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            native:
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/oh-sqlite/**'
              - 'rust/oh-sqlite-cli/**'
              - 'src/sqlite-snapshot.ts'
              - 'src/cli.ts'
              - 'scripts/build-rust-*.ts'
              - 'scripts/package-smoke.ts'
              - 'scripts/release-process-environment.ts'
              - 'scripts/run-bounded-process.ts'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            site:
              - 'site/**'
              - 'spec/**'
              - 'src/**'
              - 'benchmarks/results/**'
              - 'package.json'
              - 'README.md'
              - '.gitignore'
              - '.github/workflows/ci.yml'

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the complete check. macOS runs the same check without the
          # platform-neutral benchmark-harness tests, which Linux already covers.
          - os: ubuntu-24.04
            script: check
          - os: macos-14
            script: check:platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify governed source revision
        env:
          OH_EXPECTED_SHA: ${{ github.sha }}
          OH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OH_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const checked = git("rev-parse", "HEAD");
          const head = process.env.OH_PR_HEAD_SHA || null;
          const eventBase = process.env.OH_PR_BASE_SHA || null;
          let base = null;
          if (head !== null) {
            const ref = `refs/heads/${process.env.OH_PR_BASE_REF || ""}`;
            git("check-ref-format", ref);
            const lines = git("ls-remote", "--exit-code", "origin", ref).split("\n");
            const [sha, actualRef] = lines[0].split("\t");
            if (lines.length !== 1 || actualRef !== ref || !/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error("Cannot resolve the current governed base ref");
            }
            base = sha;
          }
          if (checked !== process.env.OH_EXPECTED_SHA) throw new Error("Unexpected CI checkout");
          const parents = git("cat-file", "-p", "HEAD").split("\n\n")[0].split("\n")
            .filter(line => line.startsWith("parent ")).map(line => line.slice(7));
          if (head !== null && (parents.length !== 2 || parents[0] !== base || parents[1] !== head)) {
            throw new Error("PR merge checkout does not bind the governed head and base");
          }
          console.log(JSON.stringify({ checked, head, base, eventBase, node: process.version }));
          NODE
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run complete check
        env:
          CHECK_SCRIPT: ${{ matrix.script }}
        run: bun run "$CHECK_SCRIPT"
      - name: Require a reproducible generated tree
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            exit 1
          fi
      - name: Inspect package contents
        run: bun pm pack --dry-run --ignore-scripts

  python-tools:
    name: Python tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for benchmark custody tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check benchmark audit and supervisor tools
        run: |
          python -B -m unittest discover -s tests -p 'test_*supervisor.py'
          python -B -m unittest discover -s tests -p 'test_gateway_v5_audit_helpers.py'
          python -B -m unittest discover -s tests -p 'test_gateway_v6_*.py'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Check Rust workspace
        working-directory: rust
        run: cargo check --locked
      - name: Lint Rust workspace
        working-directory: rust
        run: cargo clippy -- -D warnings
      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --locked
      - name: Build WASM artifacts
        run: bun run rust:build:artifacts

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify governed source revision
        env:
          OH_EXPECTED_SHA: ${{ github.sha }}
          OH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OH_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const checked = git("rev-parse", "HEAD");
          const head = process.env.OH_PR_HEAD_SHA || null;
          const eventBase = process.env.OH_PR_BASE_SHA || null;
          let base = null;
          if (head !== null) {
            const ref = `refs/heads/${process.env.OH_PR_BASE_REF || ""}`;
            git("check-ref-format", ref);
            const lines = git("ls-remote", "--exit-code", "origin", ref).split("\n");
            const [sha, actualRef] = lines[0].split("\t");
            if (lines.length !== 1 || actualRef !== ref || !/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error("Cannot resolve the current governed base ref");
            }
            base = sha;
          }
          if (checked !== process.env.OH_EXPECTED_SHA) throw new Error("Unexpected CI checkout");
          const parents = git("cat-file", "-p", "HEAD").split("\n\n")[0].split("\n")
            .filter(line => line.startsWith("parent ")).map(line => line.slice(7));
          if (head !== null && (parents.length !== 2 || parents[0] !== base || parents[1] !== head)) {
            throw new Error("PR merge checkout does not bind the governed head and base");
          }
          console.log(JSON.stringify({ checked, head, base, eventBase, node: process.version }));
          NODE
      - name: Require an exact public specification mirror
        run: diff -qr spec site/public/spec
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint site
        working-directory: site
        run: bun run lint
      # Pull requests restore caches only; main pushes save them.
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ hashFiles('site/app/**', 'site/styles/**', 'site/vendor/**', 'site/*.ts', 'site/*.mjs', 'site/*.json', 'benchmarks/results/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Read the locked Playwright version
        id: playwright
        working-directory: site
        run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-no-shell
      - name: Install Chromium and its system dependencies
        working-directory: site
        run: ./node_modules/.bin/playwright-core install --with-deps --no-shell chromium
      - name: Save Playwright browsers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Verify the built site in Chromium
        working-directory: site
        env:
          OH_BROWSER_ARTIFACTS: ${{ github.workspace }}/site/browser-artifacts
        run: |
          set -euo pipefail
          CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          export CHROMIUM_EXECUTABLE_PATH
          bun run test:browser
      - name: Upload site browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-site-browser-${{ github.sha }}
          path: site/browser-artifacts/
          if-no-files-found: error
          retention-days: 7

  napi:
    name: Build N-API crates (${{ matrix.os }} ${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo clippy --locked --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi -- -D warnings
      - name: Build N-API crates
        run: |
          set -euo pipefail
          cd rust
          cargo build --release --target ${{ matrix.target }} -p oh-canonical-napi -p oh-archive-napi -p oh-sqlite-napi
      - name: Stage .node artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="rust/napi-artifacts/${{ matrix.target }}"
          mkdir -p "$out"
          for lib in oh_canonical_napi oh_archive_napi oh_sqlite_napi; do
            found=""
            for ext in so dylib dll; do
              src="rust/target/${{ matrix.target }}/release/lib${lib}.${ext}"
              [ -f "$src" ] || src="rust/target/${{ matrix.target }}/release/${lib}.${ext}"
              if [ -f "$src" ]; then
                name="${lib%_napi}.napi"
                cp "$src" "$out/${name}.${{ matrix.target }}.node"
                found=1
                break
              fi
            done
            [ -n "$found" ] || { echo "missing built library for ${lib}" >&2; exit 1; }
          done
          ls -l "$out"
      - name: Smoke native N-API artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          NAPI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require("node:path");
          const root = path.resolve("rust/napi-artifacts", process.env.NAPI_TARGET);
          const canonical = require(path.join(root, `oh_canonical.napi.${process.env.NAPI_TARGET}.node`));
          const archive = require(path.join(root, `oh_archive.napi.${process.env.NAPI_TARGET}.node`));
          const sqlite = require(path.join(root, `oh_sqlite.napi.${process.env.NAPI_TARGET}.node`));
          if (canonical.canonicalJson('{"b":1,"a":2}') !== '{"a":2,"b":1}') {
            throw new Error("canonical N-API smoke result mismatch");
          }
          if (canonical.canonicalSha256('{"b":1,"a":2}').length !== 64) {
            throw new Error("canonical N-API digest result mismatch");
          }
          if (typeof archive.extractZipEntriesJson !== "function") {
            throw new Error("archive N-API export is missing");
          }
          if (typeof sqlite.snapshotDatabaseJson !== "function") {
            throw new Error("SQLite N-API export is missing");
          }
          NODE
      - name: Upload .node artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-${{ matrix.target }}
          path: rust/napi-artifacts/${{ matrix.target }}/*.node
          if-no-files-found: error

  # Linux arm64 and Windows x64 have no complete-check runner. These jobs build
  # their native SQLite sidecar, pack one tarball with it, and prove the packed
  # CLI and sidecar install and run on each OS.
  native-sidecar:
    name: Native sidecar (${{ matrix.platform }}-${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            binary: oh-sqlite-cli
          - os: windows-2025
            platform: win32
            arch: x64
            binary: oh-sqlite-cli.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the SQLite snapshot crates
        working-directory: rust
        run: cargo test --locked -p oh-sqlite -p oh-sqlite-cli
      - name: Build the sidecar
        working-directory: rust
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: cargo build --release --locked -p oh-sqlite-cli
      - name: Upload sidecar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-oh-sqlite-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: rust/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3

  native-pack:
    name: Native package
    needs: [changes, native-sidecar]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build WASM artifacts and the linux-x64 sidecar
        run: bun run rust:build:artifacts
      - name: Download native sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-oh-sqlite-cli-*
          path: sidecars
      - name: Stage native sidecars and pack
        run: |
          set -euo pipefail
          for pair in linux-arm64:oh-sqlite-cli win32-x64:oh-sqlite-cli.exe; do
            target="${pair%%:*}"; binary="${pair#*:}"
            mkdir -p "dist/rust-artifacts/oh-sqlite/${target}"
            cp "sidecars/ci-oh-sqlite-cli-${target}/${binary}" "dist/rust-artifacts/oh-sqlite/${target}/${binary}"
            chmod +x "dist/rust-artifacts/oh-sqlite/${target}/${binary}"
          done
          bun run rust:build:manifest
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts .
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-oh-native-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 3

  native-smoke:
    name: Install and run (${{ matrix.os }})
    needs: [changes, native-pack]
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-oh-native-package
          path: artifacts
      - name: Verify the packed CLI and native sidecar
        env:
          OH_SMOKE_REQUIRE_SIDECAR: "1"
        run: bun run ./scripts/package-smoke.ts artifacts/*.tgz
      - name: Install globally and run oh
        run: |
          set -euo pipefail
          bun add -g "$(ls artifacts/*.tgz)"
          export PATH="$(bun pm bin -g):$PATH"
          oh --version
          oh init --db "$RUNNER_TEMP/global-smoke.sqlite"
          oh verify --db "$RUNNER_TEMP/global-smoke.sqlite" --json

  required:
    name: Required
    if: always()
    needs: [changes, check, python-tools, rust, site, napi, native-sidecar, native-pack, native-smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          PYTHON_TOOLS: ${{ needs.python-tools.result }}
          RUST: ${{ needs.rust.result }}
          SITE: ${{ needs.site.result }}
          NAPI: ${{ needs.napi.result }}
          NATIVE_SIDECAR: ${{ needs.native-sidecar.result }}
          NATIVE_PACK: ${{ needs.native-pack.result }}
          NATIVE_SMOKE: ${{ needs.native-smoke.result }}
          NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          SITE_SELECTED: ${{ needs.changes.outputs.site }}
        run: |
          set -euo pipefail
          fail() { printf 'Unexpected required job result: %s=%s\n' "$1" "$2"; exit 1; }
          # Always-run jobs must succeed.
          for pair in "changes:$CHANGES" "check:$CHECK" "python-tools:$PYTHON_TOOLS"; do
            [[ "${pair#*:}" == success ]] || fail "${pair%%:*}" "${pair#*:}"
          done
          # Filtered jobs must succeed when selected, and may be skipped only
          # when the change filter reported their inputs unchanged.
          selected() {
            local name="$1" result="$2" wanted="$3"
            if [[ "$wanted" == true ]]; then
              [[ "$result" == success ]] || fail "$name" "$result"
            else
              [[ "$result" == skipped || "$result" == success ]] || fail "$name" "$result"
            fi
          }
          selected rust "$RUST" "$RUST_SELECTED"
          selected napi "$NAPI" "$RUST_SELECTED"
          selected site "$SITE" "$SITE_SELECTED"
          selected native-sidecar "$NATIVE_SIDECAR" "$NATIVE_SELECTED"
          selected native-pack "$NATIVE_PACK" "$NATIVE_SELECTED"
          selected native-smoke "$NATIVE_SMOKE" "$NATIVE_SELECTED"
