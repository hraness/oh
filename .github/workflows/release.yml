name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify stable version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'const p = await Bun.file("package.json").json(); process.stdout.write(p.version)')"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json must contain a stable semantic version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "tag must equal v<package.json version>" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run complete check
        run: bun run check
      - name: Require a reproducible generated tree
        run: git diff --exit-code
      - name: Inspect package contents
        run: bun pm pack --dry-run --ignore-scripts
      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq 'select(.draft == false and .prerelease == false and .tag_name == env.TAG and .immutable == true) | .id')"
          if [[ -z "$release_id" ]]; then
            echo "Published release is not immutable" >&2
            exit 1
          fi
