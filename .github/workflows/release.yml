name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  rust_artifacts:
    name: Build native sidecar (${{ matrix.platform }}-${{ matrix.arch }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            triple: x86_64-unknown-linux-gnu
            binary: oh-sqlite-cli
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            triple: aarch64-unknown-linux-gnu
            binary: oh-sqlite-cli
          - os: windows-2025
            platform: win32
            arch: x64
            triple: x86_64-pc-windows-msvc
            binary: oh-sqlite-cli.exe
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - name: Build oh-sqlite-cli sidecar
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${HOME}/.cargo/registry/src/=/cargo-registry-src/ --remap-path-prefix=${HOME}/.rustup/toolchains/=/rust-toolchains/ -C strip=symbols"
        run: |
          set -euo pipefail
          cd rust
          cargo build --locked --release --target ${{ matrix.triple }} -p oh-sqlite-cli
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-sqlite-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: rust/target/${{ matrix.triple }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  verified_source:
    name: Verify exact release source
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      wasm_artifact_id: ${{ steps.wasm.outputs.artifact-id }}
      wasm_artifact_digest: ${{ steps.wasm.outputs.artifact-digest }}
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve exact stable tag request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || "$EVENT_REF_TYPE" != "tag" || "$EVENT_REF" != "refs/tags/$EVENT_REF_NAME" ]]; then
            echo "::error::Release request is not one exact tag push"
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release request is not one stable semantic-version tag"
            exit 1
          fi
          printf 'tag=%s\n' "$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Verify reviewed-main release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          history=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then history=(--unshallow); fi
          git fetch --no-tags "${history[@]}" origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" "+refs/tags/$REQUESTED_TAG:refs/tags/$REQUESTED_TAG"
          if [[ "$(git cat-file -t "$REQUESTED_TAG")" != "tag" ]]; then
            echo "::error::Release tag $REQUESTED_TAG is not annotated"
            exit 1
          fi
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          site_version="$(bun -e 'const value = await Bun.file("site/package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          cli_version="$(bun src/cli.ts --version --json | bun -e 'const value = JSON.parse(await Bun.stdin.text()); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version is not stable semantic versioning"
            exit 1
          fi
          if [[ "$site_version" != "$package_version" || "$cli_version" != "$package_version" ]]; then
            echo "::error::Package, site, and compiled CLI versions do not agree"
            exit 1
          fi
          if [[ "$REQUESTED_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $REQUESTED_TAG does not match package version v$package_version"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          default_head="$(git rev-parse --verify "origin/$DEFAULT_BRANCH^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" "$default_head"; then
            echo "::error::Release tag commit is not a reviewed ancestor of current $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git ls-remote --refs --tags origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$REQUESTED_TAG" ]]; then
            echo "::error::Tag $REQUESTED_TAG is not newest stable tag $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Require release notes in the tagged changelog
        env:
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: bun run ./scripts/release-notes.ts check "$REQUESTED_TAG"
      - name: Install frozen root dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run complete root release gate
        run: bun run check
      - name: Install frozen site dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test site
        working-directory: site
        run: bun run test
      - name: Lint site
        working-directory: site
        run: bun run lint
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Require a reproducible checked tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve checked WASM assets without rebuilding in assembly
        id: wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-checked-wasm-${{ github.run_attempt }}
          path: |
            dist/rust-artifacts/oh-canonical-wasm/
            dist/rust-artifacts/oh-canonical-raw-wasm/
            dist/rust-artifacts/oh-archive-wasm/
            dist/rust-artifacts/oh-archive-strict-wasm/
            dist/rust-artifacts/oh-datalog-wasm/
          if-no-files-found: error
          retention-days: 7

  macos_build:
    name: Build unsigned Mac helpers
    needs: verified_source
    permissions:
      contents: read
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      artifact_digest: ${{ steps.unsigned.outputs.artifact-digest }}
    env:
      VERIFIED_TAG: ${{ needs.verified_source.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verified_source.outputs.verified_sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compile and package both architectures without credentials
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. -C strip=symbols"
        run: |
          set -euo pipefail
          for pair in arm64:aarch64 x64:x86_64; do
            arch="${pair%%:*}"
            triple="${pair#*:}-apple-darwin"
            cargo build --locked --release --manifest-path rust/Cargo.toml --target "$triple" -p oh-sqlite-cli
            mkdir -p "unsigned-sidecars/darwin-$arch"
            cp "rust/target/$triple/release/oh-sqlite-cli" "unsigned-sidecars/darwin-$arch/oh-sqlite-cli"
          done
          mkdir unsigned-artifacts
          archive="oh-sqlite-cli-${VERIFIED_TAG#v}-darwin-sidecars.unsigned.tar.gz"
          tar --format ustar -czf "unsigned-artifacts/$archive" -C unsigned-sidecars darwin-arm64/oh-sqlite-cli darwin-x64/oh-sqlite-cli
          (cd unsigned-artifacts && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: unsigned
        with:
          name: oh-macos-unsigned-${{ github.run_attempt }}
          path: unsigned-artifacts/
          if-no-files-found: error
          retention-days: 7

  macos_sign:
    name: Sign and notarize exact Mac helpers
    needs: [verified_source, macos_build]
    # Tag-only environment; no manual reviewers or wait timers.
    environment: hraness-apple-release
    permissions:
      actions: read
      contents: read
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed.outputs.artifact-digest }}
      archive_sha256: ${{ steps.bytes.outputs.archive_sha256 }}
      checksum_sha256: ${{ steps.bytes.outputs.checksum_sha256 }}
      arm64_sha256: ${{ steps.bytes.outputs.arm64_sha256 }}
      x64_sha256: ${{ steps.bytes.outputs.x64_sha256 }}
    env:
      VERIFIED_TAG: ${{ needs.verified_source.outputs.verified_tag }}
      VERIFIED_SHA: ${{ needs.verified_source.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verified_source.outputs.verified_sha }}
      - name: Bind unsigned input to this run and verified source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos_build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.macos_build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/unsigned-metadata.json"
          jq -e --arg id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" --arg sha "$VERIFIED_SHA" '
            (.id | tostring) == $id and .digest == $digest and .expired == false and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            (.name | test("^oh-macos-unsigned-[1-9][0-9]*$")) and .size_in_bytes > 0 and .size_in_bytes <= 134217728
          ' "$RUNNER_TEMP/unsigned-metadata.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/unsigned.zip"
          python3 -I scripts/sign-macos-sidecars.py extract-artifact "$RUNNER_TEMP/unsigned.zip" "$ARTIFACT_DIGEST" "$VERIFIED_TAG" "$RUNNER_TEMP/unsigned-input"
      - name: Sign and notarize without executing the payload
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 -I scripts/sign-macos-sidecars.py sign "$RUNNER_TEMP/unsigned-input/oh-sqlite-cli-${VERIFIED_TAG#v}-darwin-sidecars.unsigned.tar.gz" "$VERIFIED_TAG" "$GITHUB_WORKSPACE/signed-artifacts" "$RUNNER_TEMP/oh-sqlite-cli-apple-signing"
      - name: Remove signing credentials on success, failure, or cancellation
        if: always()
        run: python3 -I scripts/sign-macos-sidecars.py cleanup "$RUNNER_TEMP/oh-sqlite-cli-apple-signing"
      - name: Record final archive and individual helper hashes
        id: bytes
        run: |
          set -euo pipefail
          archive="signed-artifacts/oh-sqlite-cli-${VERIFIED_TAG#v}-darwin-sidecars.tar.gz"
          python3 -I scripts/sign-macos-sidecars.py unpack-sidecars "$archive" "$VERIFIED_TAG" "$RUNNER_TEMP/signed-helpers" --signed
          printf 'archive_sha256=%s\nchecksum_sha256=%s\n' "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)" "$(shasum -a 256 "$archive.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          for arch in arm64 x64; do
            printf '%s_sha256=%s\n' "$arch" "$(shasum -a 256 "$RUNNER_TEMP/signed-helpers/darwin-$arch/oh-sqlite-cli" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: signed
        with:
          name: oh-macos-signed-${{ github.run_attempt }}
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve non-secret notarization receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-apple-notarization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oh-sqlite-cli-apple-notarization.json
          if-no-files-found: ignore
          retention-days: 30

  verify:
    name: Assemble exact signed release package
    needs: [verified_source, rust_artifacts, macos_sign]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      writer_artifact_id: ${{ steps.writer_artifact.outputs.artifact-id }}
      verified_sha: ${{ needs.verified_source.outputs.verified_sha }}
      verified_tag: ${{ needs.verified_source.outputs.verified_tag }}
      package_sha256: ${{ steps.package_bytes.outputs.package_sha256 }}
      checksum_sha256: ${{ steps.package_bytes.outputs.checksum_sha256 }}
    env:
      VERIFIED_TAG: ${{ needs.verified_source.outputs.verified_tag }}
      VERIFIED_SHA: ${{ needs.verified_source.outputs.verified_sha }}
    steps:
      # verified_source reproduced this committed dist tree and required no diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verified_source.outputs.verified_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore the exact checked WASM build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verified_source.outputs.wasm_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.verified_source.outputs.wasm_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/wasm-metadata.json"
          jq -e --arg id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" --arg sha "$VERIFIED_SHA" '
            (.id | tostring) == $id and .digest == $digest and .expired == false and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            (.name | test("^oh-checked-wasm-[1-9][0-9]*$")) and .size_in_bytes > 0 and .size_in_bytes <= 67108864
          ' "$RUNNER_TEMP/wasm-metadata.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/wasm.zip"
          python3 -I scripts/extract-release-wasm.py "$RUNNER_TEMP/wasm.zip" "$ARTIFACT_DIGEST" "$RUNNER_TEMP/checked-wasm"
          mkdir -p dist/rust-artifacts
          cp -R "$RUNNER_TEMP/checked-wasm/"* dist/rust-artifacts/
      - name: Download and verify the exact signer output
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos_sign.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.macos_sign.outputs.artifact_digest }}
          ARCHIVE_SHA256: ${{ needs.macos_sign.outputs.archive_sha256 }}
          CHECKSUM_SHA256: ${{ needs.macos_sign.outputs.checksum_sha256 }}
          ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/signed-metadata.json"
          jq -e --arg id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" --arg sha "$VERIFIED_SHA" '
            (.id | tostring) == $id and .digest == $digest and .expired == false and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            (.name | test("^oh-macos-signed-[1-9][0-9]*$")) and .size_in_bytes > 0 and .size_in_bytes <= 134217728
          ' "$RUNNER_TEMP/signed-metadata.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/signed.zip"
          python3 -I scripts/sign-macos-sidecars.py extract-artifact "$RUNNER_TEMP/signed.zip" "$ARTIFACT_DIGEST" "$VERIFIED_TAG" "$RUNNER_TEMP/signed-input" --signed
          archive="$RUNNER_TEMP/signed-input/oh-sqlite-cli-${VERIFIED_TAG#v}-darwin-sidecars.tar.gz"
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ && "$CHECKSUM_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$(sha256sum "$archive" | cut -d ' ' -f 1)" == "$ARCHIVE_SHA256" ]] || exit 1
          [[ "$(sha256sum "$archive.sha256" | cut -d ' ' -f 1)" == "$CHECKSUM_SHA256" ]] || exit 1
          python3 -I scripts/sign-macos-sidecars.py unpack-sidecars "$archive" "$VERIFIED_TAG" "$RUNNER_TEMP/signed-helpers" --signed
          python3 -I scripts/sign-macos-sidecars.py verify-sidecars "$RUNNER_TEMP/signed-helpers" "$ARM64_SHA256" "$X64_SHA256"
          for arch in arm64 x64; do
            mkdir -p "dist/rust-artifacts/oh-sqlite/darwin-$arch"
            cp "$RUNNER_TEMP/signed-helpers/darwin-$arch/oh-sqlite-cli" "dist/rust-artifacts/oh-sqlite/darwin-$arch/oh-sqlite-cli"
          done
          python3 -I scripts/sign-macos-sidecars.py verify-sidecars dist/rust-artifacts/oh-sqlite "$ARM64_SHA256" "$X64_SHA256"
      - name: Download native sidecar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oh-sqlite-cli-*
          path: dist/rust-artifacts/sidecar-temp/
          merge-multiple: false
      - name: Stage native sidecar artifacts in the npm tree
        run: |
          set -euo pipefail
          for pair in linux-x64 linux-arm64 win32-x64; do
            binary="oh-sqlite-cli"
            if [[ "$pair" == win32-* ]]; then binary="oh-sqlite-cli.exe"; fi
            src="dist/rust-artifacts/sidecar-temp/oh-sqlite-cli-${pair}/${binary}"
            dest="dist/rust-artifacts/oh-sqlite/${pair}/${binary}"
            if [[ ! -f "$src" ]]; then
              echo "::error::Missing native sidecar artifact for ${pair}"
              exit 1
            fi
            mkdir -p "dist/rust-artifacts/oh-sqlite/${pair}"
            cp "$src" "$dest"
            chmod +x "$dest"
          done
          rm -rf dist/rust-artifacts/sidecar-temp/
      - name: Regenerate the rust artifact manifest for every staged target
        run: bun run rust:build:manifest
      - name: Create one exact npm tarball and checksum
        run: |
          set -euo pipefail
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts .
          artifacts=(artifacts/*.tgz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm release tarball"
            exit 1
          fi
          bun run ./scripts/release-artifact-checksum.ts write "${artifacts[0]}" artifacts/SHA256SUMS
      - name: Bind exact final npm package bytes
        id: package_bytes
        run: |
          set -euo pipefail
          printf 'package_sha256=%s\nchecksum_sha256=%s\n' "$(sha256sum artifacts/*.tgz | cut -d ' ' -f 1)" "$(sha256sum artifacts/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Preserve exact release bytes
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Stage dependency-free npm writer from reviewed source
        run: |
          set -euo pipefail
          mkdir -p release-writer/scripts
          cp package.json release-writer/package.json
          cp scripts/check-npm-trusted-publishing.ts release-writer/scripts/
          cp scripts/publish-npm-release.ts release-writer/scripts/
          cp scripts/release-artifact-checksum.ts release-writer/scripts/
          cp scripts/release-attempt-policy.ts release-writer/scripts/
          cp scripts/release-policy.ts release-writer/scripts/
          cp scripts/release-process-environment.ts release-writer/scripts/
          cp scripts/run-bounded-process.ts release-writer/scripts/
      - name: Preserve exact dependency-free npm writer
        id: writer_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-release-writer
          path: release-writer/
          if-no-files-found: error
          retention-days: 7

  exact_artifact:
    name: Exact tarball install (${{ matrix.os }})
    needs: verify
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, ubuntu-22.04-arm, windows-2025]
    env:
      EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.verify.outputs.checksum_sha256 }}
      RELEASE_REQUIRE_EXPECTED_HASHES: "1"
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
      - name: Download exact release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Verify checksum and installed public boundary
        env:
          OH_SMOKE_REQUIRE_SIDECAR: "1"
        run: |
          bun run ./scripts/release-artifact-checksum.ts check artifacts/*.tgz artifacts/SHA256SUMS
          bun run ./scripts/package-smoke.ts artifacts/*.tgz

  publish_github:
    name: Publish immutable GitHub Release
    needs: [verify, exact_artifact]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.verify.outputs.checksum_sha256 }}
      RELEASE_REQUIRE_EXPECTED_HASHES: "1"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
      RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Download validated release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Recheck exact checksum
        run: bun run ./scripts/release-artifact-checksum.ts check artifacts/*.tgz artifacts/SHA256SUMS
      - name: Create and prove immutable GitHub Release from the exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ./scripts/publish-github-release.ts "$VERIFIED_TAG" artifacts/*.tgz artifacts/SHA256SUMS

  publish_npm:
    name: Publish exact npm package
    needs: [verify, publish_github, pre_npm]
    environment: npm-release
    permissions:
      contents: none
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      provenance_attempt: ${{ steps.publish.outputs.provenance_attempt }}
      provenance_attempt_mode: ${{ steps.publish.outputs.provenance_attempt_mode }}
      provenance_run_id: ${{ steps.publish.outputs.provenance_run_id }}
    env:
      EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.verify.outputs.checksum_sha256 }}
      RELEASE_REQUIRE_EXPECTED_HASHES: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      PRE_NPM_RUN_ATTEMPT: ${{ needs.pre_npm.outputs.preflight_run_attempt }}
      PRE_NPM_RUN_ID: ${{ needs.pre_npm.outputs.preflight_run_id }}
      PRE_NPM_STATE: ${{ needs.pre_npm.outputs.npm_state }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
      - name: Download validated release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Download reviewed dependency-free npm writer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.writer_artifact_id }}
          path: writer
          merge-multiple: true
      - name: Require a trusted-publishing-capable npm client
        run: bun run ./writer/scripts/check-npm-trusted-publishing.ts
      - name: Recheck exact checksum
        run: bun run ./writer/scripts/release-artifact-checksum.ts check artifacts/*.tgz artifacts/SHA256SUMS
      - name: Publish exact tarball through npm trusted publishing
        id: publish
        run: bun run ./writer/scripts/publish-npm-release.ts artifacts/*.tgz

  pre_npm:
    name: Admit npm retry state
    needs: [verify, publish_github]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      npm_state: ${{ steps.state.outputs.npm_state }}
      preflight_run_attempt: ${{ steps.state.outputs.preflight_run_attempt }}
      preflight_run_id: ${{ steps.state.outputs.preflight_run_id }}
    env:
      EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.verify.outputs.checksum_sha256 }}
      RELEASE_REQUIRE_EXPECTED_HASHES: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Node.js for provenance verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install pinned provenance verifier
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download exact release bytes by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Verify producing-job package hashes
        run: bun run ./scripts/release-artifact-checksum.ts check artifacts/*.tgz artifacts/SHA256SUMS
      - name: Admit absent or exact same-run npm state
        id: state
        run: bun run ./scripts/check-npm-retry-state.ts artifacts/*.tgz

  admit:
    name: Admit public release
    needs: [verify, pre_npm, publish_npm]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      NPM_PROVENANCE_ATTEMPT: ${{ needs.publish_npm.outputs.provenance_attempt }}
      NPM_PROVENANCE_ATTEMPT_MODE: ${{ needs.publish_npm.outputs.provenance_attempt_mode }}
      NPM_PROVENANCE_RUN_ID: ${{ needs.publish_npm.outputs.provenance_run_id }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install pinned provenance verifier
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Node.js for npm provenance admission
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Admit both public distributions
        run: bun run ./scripts/check-public-release.ts
