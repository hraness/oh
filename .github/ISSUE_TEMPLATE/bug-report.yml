name: Bug report
description: Report incorrect behavior in Oh that you can reproduce
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Leave out credentials and private research records, and report a security vulnerability through a [private security advisory](https://github.com/hraness/oh/security/advisories/new) instead of this form.
  - type: input
    id: version
    attributes:
      label: Oh version
      description: Paste the output of `oh version`, or the `@hraness/oh` version in your lockfile.
      placeholder: x.y.z
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the runtime (Bun or Node.js) with its version, and the operating system.
      placeholder: Bun 1.3.14 on macOS 15.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest commands, code, or public fixture that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the output, with secrets removed, and the exit status. Do not attach a database that holds sensitive data.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Replay verification
      description: If the store holds nothing sensitive, paste the output of `oh verify`. It checks SQLite integrity and replays every operation in the space, then prints digests and counts but no record content. Add `--db PATH` if the store is not at `.oh/oh.sqlite`, and `--space ID` if the space is not `default`.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest stable release.
          required: true
        - label: This report contains no secrets or private research data.
          required: true
        - label: This report does not describe an unpatched security vulnerability.
          required: true
