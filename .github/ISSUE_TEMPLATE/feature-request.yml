name: Feature request
description: Propose a focused addition to Oh
title: "request: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Research workflow
      description: Describe the agentic research task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the observable behavior without prescribing an implementation when several designs could work.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - CLI or SDK
        - Ontology or schema
        - SQLite storage
        - Sync
        - Search or embeddings
        - Agent Skill
        - Documentation or site
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility constraints
      description: Name any existing records, digests, schemas, or integrations that must remain compatible.
