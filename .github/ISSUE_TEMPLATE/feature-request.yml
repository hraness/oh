name: Feature request
description: Propose a focused addition to Oh
title: "request: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: Describe the agent or research task that is hard to do with Oh today, and how you handle it now.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want to observe. Leave the design open when more than one could work.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI or SDK
        - Agent memory
        - Search, recall, or embeddings
        - Projections (Datalog rules)
        - Ontology or schema
        - SQLite or libSQL storage
        - Sync
        - Research profile
        - Agent Skill
        - Documentation or website
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility constraints
      description: Name the records, digests, schemas, or integrations you rely on that must stay compatible.
