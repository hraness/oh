[package]
name = "oh-archive-napi"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "N-API bindings for oh-archive."

[dependencies]
oh-archive = { path = "../oh-archive" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
serde_json = "1.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
napi-build = "2"
